<div class="p-3 flex flex-col gap-3">
  <h1 class="text-3xl font-semibold">Categories</h1>
  <div
    *ngIf="tableData.length === 0 && !isLoading"
    class="hero bg-blue-100 min-h-screen rounded"
  >
    <h2 class="text-2xl font-semibold hero-content text-center">
      No data available.
    </h2>
  </div>
  <div *ngIf="isLoading">
    <app-table-skeleton></app-table-skeleton>
  </div>
  <div *ngIf="tableData.length !== 0">
    <app-table
      [tableColumns]="tableColumns"
      [tableData]="tableData"
    ></app-table>
  </div>
</div>
