<div class="overflow-x-auto bg-blue-100 rounded min-h-screen">
  <div class="p-4">
    <table class="table">
      <!-- head -->
      <thead>
        <tr>
          <th
            *ngFor="let disCol of tableColumns; let colIndex = index"
            class="border border-gray-300 p-2 text-left"
          >
            {{ disCol.header }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let element of tableData" class="hover:bg-gray-100">
          <td
            *ngFor="let col of tableColumns"
            class="border border-gray-300 p-2"
          >
            <div class="avatar" *ngIf="col.type === 'image'; else nonImage">
              <div class="mask mask-squircle h-12 w-12">
                <img
                  [src]="col.cell(element)"
                  alt="{{ col.header }}"
                  class="h-12 w-12 object-cover rounded"
                />
              </div>
            </div>
            <ng-template #nonImage>
              <span *ngIf="col.type === 'text'">
                {{ col.cell(element) }}
              </span>

              <a
                *ngIf="col.type === 'link'"
                [routerLink]="[col.url]"
                class="text-blue-500 hover:underline"
              >
                {{ col.cell(element) }}
              </a>
              <a
                *ngIf="col.type === 'icon'"
                class="icon-button cursor-pointer"
                (click)="onIconClick(col.icon, element)"
              >
                <span
                  class="material-icons-outlined"
                  [class]="
                    col.icon === 'delete' ? 'text-red-600' : 'text-blue-600'
                  "
                >
                  {{ col.icon }}
                </span>
              </a>
            </ng-template>
          </td>
        </tr>
      </tbody>
      <!-- foot -->
      <tfoot></tfoot>
    </table>
  </div>
</div>
